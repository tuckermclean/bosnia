template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: "npm test -w @bosanski/backend; b=$?; npm run test -w @bosanski/content; c=$?; (cd app && npx jest); a=$?; (cd voice-agent && python3 -m unittest discover -s tests -t .); v=$?; exit $((b|c|a|v))"
  fail_pattern: '^ FAIL  \S+ > |^  ● (?!Test suite failed to run|Console$)|^(FAIL|ERROR): test'
  known_red: []
out_of_scope:
  - {glob: "content/generated/", reason: "curriculum data (course, blueprint, skills): changed by the owner's generation and native-speaker review runs, not by nodes"}
  - {glob: "content/audio-out/", reason: "the TTS reference-audio manifest, regenerated by npm run audio -w @bosanski/content"}
  - {glob: "app/assets/", reason: "binary icons and images, not code"}
nodes:
  - id: R01
    name: workspace
    deps: []
    track: done
    status: imported
    owns: ["package.json", "package-lock.json", "tsconfig.base.json"]
    summary: "The root npm workspace (backend and content as members, Node >=20, a backend-only test script), its lockfile, and the shared strict TypeScript options the backend and content extend."
  - id: R02
    name: repo-docs
    deps: []
    track: done
    status: imported
    owns: ["README.md", "FOLLOWUPS.md", ".env.example"]
    summary: "The repository README, the FOLLOWUPS.md backlog of deferred work and known limitations, and the root .env.example template of server-side settings."
  - id: R03
    name: ignore-lists
    deps: []
    track: done
    status: imported
    owns: [".gitignore", ".dockerignore"]
    summary: "The root .gitignore (dependencies, build output, env and secret files, local databases, binary audio) and the root .dockerignore that filters the backend image's build context."
  - id: R04
    name: agents-doc
    deps: [R02, B01]
    track: now
    owns: ["AGENTS.md", "backend/test/agents-doc.test.ts"]
    summary: "AGENTS.md bounds the local test runs (--maxWorkers=2 in the quick-gate and red-target commands, no --no-cache, single test files locally and whole suites only in CI), has mutation and pin checks applied in a scratch copy of the worktree, and lists itself on the Spec files line; gate.command and CI are unchanged, and a backend test reads AGENTS.md."
  - id: C01
    name: content-package
    deps: [R01]
    track: done
    status: imported
    owns: ["content/README.md", "content/package.json", "content/tsconfig.json", "content/vitest.config.ts"]
    summary: "The @bosanski/content workspace package: one tsx script per pipeline stage, the vitest test script and typecheck, its tsconfig and vitest config, and its README."
  - id: C02
    name: course-schema
    deps: [C01]
    track: done
    status: imported
    owns: ["content/src/schema.ts", "content/src/paths.ts"]
    summary: "The zod schemas of the blueprint, the course contract the backend ingests and the audio manifest, and the pipeline's data paths under CONTENT_DATA_ROOT or the package folder."
  - id: C03
    name: llm-provider
    deps: [C01]
    track: done
    status: imported
    owns: ["content/src/llm.ts", "content/test/llm.test.ts"]
    summary: "The pluggable LLM client: Anthropic, else OpenAI, else the offline MockProvider by env key; code-fence stripping and generateJSON."
  - id: C04
    name: generation
    deps: [C02, C03]
    track: done
    status: imported
    owns: ["content/src/blueprint.ts", "content/src/generate-skill.ts", "content/src/generate.ts", "content/test/generate-skill.test.ts"]
    summary: "The blueprint and per-skill generation stages (cached, resumable, with a best-effort self-review pass) and the assembly of course.json."
  - id: C05
    name: validation
    deps: [C02]
    track: done
    status: imported
    owns: ["content/src/validate.ts", "content/test/validate.test.ts"]
    summary: "The course validator: answer, word-bank, target-phrase and diacritics errors, duplicate-vocab warnings, and npm run validate's report and exit code."
  - id: C06
    name: reference-audio
    deps: [C02, C04]
    track: done
    status: imported
    owns: ["content/src/synthesize-audio.ts", "content/test/synthesize-audio.test.ts"]
    summary: "The bs-BA reference-audio stage: content-hashed Azure TTS (placeholder URLs in a dry run), the manifest, and audioHash stamping."
  - id: C07
    name: review-tooling
    deps: [C02, C04]
    track: done
    status: imported
    owns: ["content/src/csv.ts", "content/src/export-review.ts", "content/src/apply-review.ts"]
    summary: "The native-speaker review round trip: per-unit Markdown and CSV export, and applying the CSV's corrections with the unit's sign-off to reviewed."
  - id: C08
    name: seed-a1
    deps: [C02]
    track: done
    status: imported
    owns: ["content/scripts/seed-a1.ts"]
    summary: "The one-off script that writes a hand-authored one-unit A1 course over the generated curriculum."
  - id: B01
    name: backend-package
    deps: [R01]
    track: done
    status: imported
    owns: ["backend/package.json", "backend/tsconfig.json", "backend/vitest.config.ts", "backend/README.md"]
    summary: "The @bosanski/backend workspace package: its scripts (dev, start, build, typecheck, test with vitest, test:watch, db:generate, db:migrate, seed, smoke:groq), dependencies, tsconfig, vitest config and README."
  - id: B02
    name: env-config
    deps: [B01]
    track: done
    status: imported
    owns: ["backend/src/env.ts"]
    summary: "The backend's settings: best-effort .env loading, the zod-parsed env with keyless defaults, isLocalDb, and the JWT-secret boot guard."
  - id: B03
    name: database
    deps: [B02]
    track: done
    status: imported
    owns: ["backend/src/db/schema.ts", "backend/src/db/ddl.ts", "backend/src/db/client.ts"]
    summary: "The Drizzle schema, the hand-kept IF NOT EXISTS DDL, and the PGlite or Postgres handle with initSchema and createTestDb."
  - id: B04
    name: service-adapters
    deps: [B02, B03]
    track: done
    status: imported
    owns: ["backend/src/deps.ts", "backend/src/services/groq.ts", "backend/src/services/livekit.ts", "backend/scripts/smoke-groq.ts", "backend/test/helpers.ts"]
    summary: "The injected AppDeps, the Groq Whisper transcriber, the LiveKit room-token minter with room metadata, the opt-in Groq smoke script, and the test fakes."
  - id: B05
    name: auth
    deps: [B02, B03, B04]
    track: done
    status: imported
    owns: ["backend/src/services/auth.ts", "backend/src/http.ts", "backend/src/routes/auth.ts", "backend/test/auth.test.ts"]
    summary: "Argon2 passwords, access and refresh JWTs with rotation, the register/login/refresh/me routes, HttpError and the requireAuth guard."
  - id: B06
    name: course-seed
    deps: [B03, C02]
    track: done
    status: imported
    owns: ["backend/scripts/seed-course.ts", "backend/src/auto-seed.ts", "backend/test/auto-seed.test.ts"]
    summary: "seedCourse's idempotent upsert of the content's course.json and audio manifest, the seed CLI, and the local-dev auto-seed of an empty database."
  - id: B07
    name: lessons-progress
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/services/progression.ts", "backend/src/routes/courses.ts", "backend/src/routes/progress.ts", "backend/test/progress.test.ts"]
    summary: "The skill tree and lesson routes with server-side unlocks, and progress: xp, hearts and their regeneration, streaks, crowns and the next-skill unlock."
  - id: B08
    name: pronunciation
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/services/scoring.ts", "backend/src/routes/pronunciation.ts", "backend/test/scoring.test.ts", "backend/test/pronunciation.test.ts"]
    summary: "Deterministic transcript-vs-target scoring and the multipart pronunciation route: transcribe, score, save the attempt."
  - id: B09
    name: tutor-session
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/routes/tutor.ts", "backend/test/tutor.test.ts"]
    summary: "POST /api/tutor/session: a LiveKit room token with the CEFR level and scenario as room metadata, and the saved session row."
  - id: B10
    name: api-server
    deps: [B02, B03, B04, B05, B06, B07, B08, B09]
    track: done
    status: pinned
    owns: ["backend/src/app.ts", "backend/src/index.ts", "backend/test/integration.test.ts"]
    summary: "buildApp (CORS, helmet, multipart limit, error handler, /health, the routes) and the server boot: guard, schema, auto-seed, listen; with the end-to-end test over the committed curriculum."
  - id: B11
    name: backend-image
    deps: [B01, B06, B10, R03]
    track: done
    status: imported
    owns: ["backend/Dockerfile"]
    summary: "The two-stage production image built from the repository root, with the curriculum baked in under CONTENT_DIR, run as the node user."
  - id: B12
    name: jwt-secret-guard
    deps: [R02, B01, B02, D03, D04]
    track: now
    owns: ["backend/test/env.test.ts"]
    summary: "The production JWT boot guard also refuses the Secret template's REPLACE_WITH placeholders and secrets under 32 characters, with tests; the Secret template lists the voice agent's optional settings, and DEPLOY.md, the backend README and .env.example describe the guard."
  - id: B13
    name: doc-scripts
    deps: [B01, C01, D04]
    track: now
    owns: ["backend/test/doc-scripts.test.ts"]
    summary: "The dangling db:migrate and db:generate scripts are removed, DEPLOY.md's schema section says the schema comes only from initSchema() on boot, content/README.md drops npm run seed-a1, and a backend test checks that every npm run script these two docs name exists and every tsx script names a file that exists."
  - id: B14
    name: start-script
    deps: [B01, B11]
    track: now
    owns: ["backend/test/start-script.test.ts"]
    summary: "The backend's start script and main field point at dist/src/index.js, the entrypoint the build emits, and a backend test derives that path from tsconfig.json's outDir and rootDir and checks it against start, main and the Dockerfile's CMD."
  - id: B15
    name: missing-key-503
    deps: [B04, B08, B09, B10]
    track: now
    owns: ["backend/src/unavailable.ts", "backend/test/missing-keys.test.ts", "backend/test/dep-pins.test.ts"]
    summary: "Without its Groq or LiveKit settings, POST /api/pronunciation or POST /api/tutor/session answers 503 naming the feature, not the variable, and the server log names the missing settings; the server logs at info with Fastify's per-request lines off and no secret or token in its lines, with keyless tests of both routes and of the log."
  - id: B16
    name: request-errors-4xx
    deps: [B05, B08, B10]
    track: now
    owns: ["backend/test/request-errors.test.ts"]
    summary: "The error handler answers an error that carries a 4xx statusCode (Fastify's malformed-body and unsupported-media-type errors, the multipart plugin's not-multipart error) with that status and its standard reason phrase, keeps every other unexpected error at 500 without its message, and a concurrent duplicate sign-up answers 409 like a sequential one."
  - id: A01
    name: app-package
    deps: []
    track: done
    status: imported
    owns: ["app/package.json", "app/package-lock.json", "app/.npmrc", "app/tsconfig.json", "app/babel.config.js", "app/app.json", "app/.env.example", "app/.gitignore", "app/README.md", "app/LICENSE"]
    summary: "The Expo app package outside the workspace: its dependencies, lockfile and scripts, the jest-expo config, tsconfig with the @/ alias, Babel with the worklets plugin, app.json, the public env template, ignore list, README and the Expo template's LICENSE."
  - id: A02
    name: design-system
    deps: [A01]
    track: done
    status: imported
    owns: ["app/src/theme/", "app/src/components/"]
    summary: "The Ljiljan gold-and-blue design tokens and the shared components: Button, Card, HeartsBar, ProgressBar, ScreenContainer, TextField, XpBadge and StreakBadge."
  - id: A03
    name: api-client
    deps: [A01, B05, B07, B08, B09, B10]
    track: done
    status: imported
    owns: ["app/src/api/", "app/src/types/", "app/src/hooks/", "app/src/constants.ts"]
    summary: "The typed backend client: base URL resolution, bearer tokens in SecureStore, one refresh-and-retry on a 401, ApiError from the { error } body, per-resource calls, the hand-kept wire types, the TanStack Query client and hooks, and the mirrored server constants."
  - id: A04
    name: app-shell
    deps: [A02, A03]
    track: done
    status: imported
    owns: ["app/src/state/", "app/app/_layout.tsx", "app/app/index.tsx", "app/app/(auth)/", "app/app/(tabs)/_layout.tsx"]
    summary: "The Zustand auth store, the root layout (providers, hydration, splash, the bounce to sign-in), the index redirect, the sign-in and sign-up screens, and the Learn/Tutor/Profile tab bar."
  - id: A05
    name: pronunciation-ui
    deps: [A02, A03]
    track: done
    status: imported
    owns: ["app/src/features/pronunciation/", "app/src/utils/"]
    summary: "RecordExercise: record with expo-audio, auto-submit to the pronunciation route, show the score, per-word chips and transcript; and the http(s)-only playable-audio check."
  - id: A06
    name: lesson-runner
    deps: [A02, A03, A05]
    track: done
    status: imported
    owns: ["app/src/features/lesson/", "app/app/lesson/"]
    summary: "The lesson route and runner: exercise sequencing, local hearts, the pass, fail and out-of-hearts summaries, the lesson-complete report, and the five exercise components."
  - id: A07
    name: home-profile
    deps: [A02, A03, A04, A06]
    track: done
    status: imported
    owns: ["app/src/features/home/", "app/app/(tabs)/home.tsx", "app/app/(tabs)/profile.tsx"]
    summary: "The Learn tab's skill path (units, zig-zag skill nodes, locks, crowns, the unreviewed tag, empty and error states) and the Profile tab's stats and log out."
  - id: A08
    name: voice-tutor-ui
    deps: [A02, A03, A04]
    track: done
    status: imported
    owns: ["app/src/features/tutor/", "app/app/tutor.tsx", "app/app/(tabs)/tutor.tsx"]
    summary: "The Tutor tab and the full-screen call: the Expo Go availability gate, the learner's CEFR level, a lazily loaded LiveKit call with status, the tutor's transcript, mute, interrupt and end call."
  - id: A09
    name: sign-in-redirect
    deps: [A04]
    track: now
    owns: ["app/__tests__/auth-navigation.test.tsx"]
    summary: "A session that becomes authenticated on a sign-in or sign-up screen lands on the Learn tab without a restart, and an app test renders the shell's routes with expo-router's renderRouter and a mocked API client to pin that redirect, the boot redirects and the bounce to sign-in."
  - id: A10
    name: tests-out-of-routes
    deps: [A01, A07]
    track: now
    owns: ["app/__tests__/home.test.tsx", "app/__tests__/routes-folder.test.ts"]
    summary: "The home test moves out of expo-router's routes folder to app/__tests__/ with its cases unchanged, and an app test fails whenever a file under app/app/ is a test file or sits in a __tests__ folder."
  - id: V01
    name: voice-package
    deps: []
    track: done
    status: imported
    owns: ["voice-agent/README.md", "voice-agent/requirements.txt"]
    summary: "The voice-agent package's README (pipeline, call flow, env vars, run, probe, test, known limitations) and its pinned LiveKit Agents 1.6.4 dependency set with httpx."
  - id: V02
    name: tutor-prompt
    deps: []
    track: done
    status: imported
    owns: ["voice-agent/prompts.py", "voice-agent/tests/"]
    summary: "build_system_prompt: the pure Bosnian-only tutor system prompt with CEFR A1-B2 level guidance and optional role-play scenarios, and its unittest suite."
  - id: V03
    name: agent-config
    deps: []
    track: done
    status: imported
    owns: ["voice-agent/config.py"]
    summary: "load_config: the worker's settings from the environment, validated lazily, requiring only the selected providers' keys and raising ConfigError that names a missing variable."
  - id: V04
    name: turn-logger
    deps: [V01]
    track: done
    status: imported
    owns: ["voice-agent/turn_logger.py"]
    summary: "TurnLogger: each tutor turn logged locally as JSON and, when BACKEND_TURNS_URL is set, posted fire-and-forget with an optional bearer token."
  - id: V05
    name: voice-worker
    deps: [V01, V02, V03, V04, B04, B09]
    track: done
    status: imported
    owns: ["voice-agent/agent.py"]
    summary: "The LiveKit Agents worker: Silero VAD prewarm, the STT and LLM provider seams, Azure bs-BA TTS, level and scenario from the room metadata, the tuned turn handling, and turn logging."
  - id: V06
    name: latency-probe
    deps: [V01, V03, V05]
    track: done
    status: imported
    owns: ["voice-agent/latency_probe.py"]
    summary: "The per-stage latency probe: STT round trip, LLM first chunk and TTS first audio against the live providers, or SIMULATED figures with --mock, against the 0.6-1s budget."
  - id: V07
    name: voice-image
    deps: [V01, V05]
    track: done
    status: imported
    owns: ["voice-agent/Dockerfile", "voice-agent/.dockerignore"]
    summary: "The self-contained python:3.11-slim worker image built from voice-agent/, run as a non-root user with python agent.py start, and its build-context ignore list."
  - id: D01
    name: ci
    deps: [R01, B01, C01, A01, V01]
    track: done
    status: imported
    owns: [".github/workflows/ci.yml"]
    summary: "The CI workflow: on pushes and pull requests to main, and when called by another workflow, one job per package runs its typecheck (py_compile for the voice agent) and tests on Node 22 and Python 3.11."
  - id: D02
    name: release
    deps: [D01, B11, V07]
    track: done
    status: imported
    owns: [".github/workflows/release.yml"]
    summary: "The Release workflow: on pushes to main and v* tags, after ci.yml passes, builds and pushes the backend and voice-agent images to GHCR with sha, latest and semver tags."
  - id: D03
    name: k8s-manifests
    deps: [R03, B02, B06, B10, B11, V03, V07, D02]
    track: done
    status: imported
    owns: ["deploy/"]
    summary: "The Kubernetes manifests in the ljiljan namespace: the Secret template, the backend Deployment (2 replicas, /health probes) and ClusterIP Service, the seed Job, the voice-agent worker Deployment and a commented-out Ingress."
  - id: D04
    name: deploy-guide
    deps: [B02, B03, D02, D03]
    track: done
    status: imported
    owns: ["DEPLOY.md"]
    summary: "DEPLOY.md, the operator's guide from the CI-built images to a running cluster deployment: GHCR access, the manifests in order, the Secret, the seed Job, the schema on boot, the JWT boot guard and rollouts."
  - id: D05
    name: kustomize-images
    deps: [R01, B01, D03, D04]
    track: now
    owns: ["backend/test/deploy-kustomization.test.ts"]
    summary: "A deploy/kustomization.yaml lists the manifests and sets both images' registry, owner and tag in its images field, committed as this repository's GHCR images at latest and applied with kubectl apply -k; DEPLOY.md describes that flow and a sha tag rollout, and a backend test checks the kustomization against deploy/ with a YAML parse."
  - id: D06
    name: pr-image-build
    deps: [B11, V07, D02]
    track: now
    owns: [".github/workflows/images.yml"]
    summary: "A pull-request-only Images workflow builds the backend and voice-agent images with Release's Dockerfiles, contexts and build-cache scopes, without logging in or pushing, so a broken Dockerfile fails on the PR instead of after the merge."
