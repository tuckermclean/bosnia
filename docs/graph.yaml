template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: "npm test -w @bosanski/backend; b=$?; npm run test -w @bosanski/content; c=$?; (cd app && npx jest); a=$?; (cd voice-agent && python3 -m unittest discover -s tests -t .); v=$?; exit $((b|c|a|v))"
  fail_pattern: '^ FAIL  \S+ > |^  ● (?!Test suite failed to run)|^(FAIL|ERROR): test'
  known_red: []
out_of_scope:
  - {glob: "content/generated/", reason: "curriculum data (course, blueprint, skills): changed by the owner's generation and native-speaker review runs, not by nodes"}
  - {glob: "content/audio-out/", reason: "the TTS reference-audio manifest, regenerated by npm run audio -w @bosanski/content"}
  - {glob: "app/assets/", reason: "binary icons and images, not code"}
adoption:
  areas:
    - {name: repo-root, globs: ["package.json", "package-lock.json", "tsconfig.base.json", "README.md", "FOLLOWUPS.md", ".env.example", ".gitignore", ".dockerignore"]}
    - {name: content-pipeline, globs: ["content/*", "content/src/", "content/test/", "content/scripts/"]}
    - {name: backend, globs: ["backend/"]}
    - {name: app, globs: ["app/*", "app/app/", "app/src/"]}
    - {name: voice-agent, globs: ["voice-agent/"]}
    - {name: deploy, globs: ["deploy/", "DEPLOY.md", ".github/"]}
nodes: []
