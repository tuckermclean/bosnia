template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: "npm test -w @bosanski/backend; b=$?; npm run test -w @bosanski/content; c=$?; (cd app && npx jest); a=$?; (cd voice-agent && python3 -m unittest discover -s tests -t .); v=$?; exit $((b|c|a|v))"
  fail_pattern: '^ FAIL  \S+ > |^  ● (?!Test suite failed to run|Console$)|^(FAIL|ERROR): test'
  known_red: []
out_of_scope:
  - {glob: "content/generated/", reason: "curriculum data (course, blueprint, skills): changed by the owner's generation and native-speaker review runs, not by nodes"}
  - {glob: "content/audio-out/", reason: "the TTS reference-audio manifest, regenerated by npm run audio -w @bosanski/content"}
  - {glob: "app/assets/", reason: "binary icons and images, not code"}
adoption:
  areas:
    - {name: app, globs: ["app/*", "app/app/", "app/src/"]}
    - {name: voice-agent, globs: ["voice-agent/"]}
    - {name: deploy, globs: ["deploy/", "DEPLOY.md", ".github/"]}
nodes:
  - id: R01
    name: workspace
    deps: []
    track: done
    status: imported
    owns: ["package.json", "package-lock.json", "tsconfig.base.json"]
    summary: "The root npm workspace (backend and content as members, Node >=20, a backend-only test script), its lockfile, and the shared strict TypeScript options the backend and content extend."
  - id: R02
    name: repo-docs
    deps: []
    track: done
    status: imported
    owns: ["README.md", "FOLLOWUPS.md", ".env.example"]
    summary: "The repository README, the FOLLOWUPS.md backlog of deferred work and known limitations, and the root .env.example template of server-side settings."
  - id: R03
    name: ignore-lists
    deps: []
    track: done
    status: imported
    owns: [".gitignore", ".dockerignore"]
    summary: "The root .gitignore (dependencies, build output, env and secret files, local databases, binary audio) and the root .dockerignore that filters the backend image's build context."
  - id: C01
    name: content-package
    deps: [R01]
    track: done
    status: imported
    owns: ["content/README.md", "content/package.json", "content/tsconfig.json", "content/vitest.config.ts"]
    summary: "The @bosanski/content workspace package: one tsx script per pipeline stage, the vitest test script and typecheck, its tsconfig and vitest config, and its README."
  - id: C02
    name: course-schema
    deps: [C01]
    track: done
    status: imported
    owns: ["content/src/schema.ts", "content/src/paths.ts"]
    summary: "The zod schemas of the blueprint, the course contract the backend ingests and the audio manifest, and the pipeline's data paths under CONTENT_DATA_ROOT or the package folder."
  - id: C03
    name: llm-provider
    deps: [C01]
    track: done
    status: imported
    owns: ["content/src/llm.ts", "content/test/llm.test.ts"]
    summary: "The pluggable LLM client: Anthropic, else OpenAI, else the offline MockProvider by env key; code-fence stripping and generateJSON."
  - id: C04
    name: generation
    deps: [C02, C03]
    track: done
    status: imported
    owns: ["content/src/blueprint.ts", "content/src/generate-skill.ts", "content/src/generate.ts", "content/test/generate-skill.test.ts"]
    summary: "The blueprint and per-skill generation stages (cached, resumable, with a best-effort self-review pass) and the assembly of course.json."
  - id: C05
    name: validation
    deps: [C02]
    track: done
    status: imported
    owns: ["content/src/validate.ts", "content/test/validate.test.ts"]
    summary: "The course validator: answer, word-bank, target-phrase and diacritics errors, duplicate-vocab warnings, and npm run validate's report and exit code."
  - id: C06
    name: reference-audio
    deps: [C02, C04]
    track: done
    status: imported
    owns: ["content/src/synthesize-audio.ts", "content/test/synthesize-audio.test.ts"]
    summary: "The bs-BA reference-audio stage: content-hashed Azure TTS (placeholder URLs in a dry run), the manifest, and audioHash stamping."
  - id: C07
    name: review-tooling
    deps: [C02, C04]
    track: done
    status: imported
    owns: ["content/src/csv.ts", "content/src/export-review.ts", "content/src/apply-review.ts"]
    summary: "The native-speaker review round trip: per-unit Markdown and CSV export, and applying the CSV's corrections with the unit's sign-off to reviewed."
  - id: C08
    name: seed-a1
    deps: [C02]
    track: done
    status: imported
    owns: ["content/scripts/seed-a1.ts"]
    summary: "The one-off script that writes a hand-authored one-unit A1 course over the generated curriculum."
  - id: B01
    name: backend-package
    deps: [R01]
    track: done
    status: imported
    owns: ["backend/package.json", "backend/tsconfig.json", "backend/vitest.config.ts", "backend/README.md"]
    summary: "The @bosanski/backend workspace package: its scripts (dev, build, typecheck, vitest test, seed, smoke:groq), dependencies, tsconfig, vitest config and README."
  - id: B02
    name: env-config
    deps: [B01]
    track: done
    status: imported
    owns: ["backend/src/env.ts"]
    summary: "The backend's settings: best-effort .env loading, the zod-parsed env with keyless defaults, isLocalDb, and the JWT-secret boot guard."
  - id: B03
    name: database
    deps: [B02]
    track: done
    status: imported
    owns: ["backend/src/db/schema.ts", "backend/src/db/ddl.ts", "backend/src/db/client.ts"]
    summary: "The Drizzle schema, the hand-kept IF NOT EXISTS DDL, and the PGlite or Postgres handle with initSchema and createTestDb."
  - id: B04
    name: service-adapters
    deps: [B02, B03]
    track: done
    status: imported
    owns: ["backend/src/deps.ts", "backend/src/services/groq.ts", "backend/src/services/livekit.ts", "backend/scripts/smoke-groq.ts", "backend/test/helpers.ts"]
    summary: "The injected AppDeps, the Groq Whisper transcriber, the LiveKit room-token minter with room metadata, the opt-in Groq smoke script, and the test fakes."
  - id: B05
    name: auth
    deps: [B02, B03, B04]
    track: done
    status: imported
    owns: ["backend/src/services/auth.ts", "backend/src/http.ts", "backend/src/routes/auth.ts", "backend/test/auth.test.ts"]
    summary: "Argon2 passwords, access and refresh JWTs with rotation, the register/login/refresh/me routes, HttpError and the requireAuth guard."
  - id: B06
    name: course-seed
    deps: [B03, C02]
    track: done
    status: imported
    owns: ["backend/scripts/seed-course.ts", "backend/src/auto-seed.ts", "backend/test/auto-seed.test.ts"]
    summary: "seedCourse's idempotent upsert of the content's course.json and audio manifest, the seed CLI, and the local-dev auto-seed of an empty database."
  - id: B07
    name: lessons-progress
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/services/progression.ts", "backend/src/routes/courses.ts", "backend/src/routes/progress.ts", "backend/test/progress.test.ts"]
    summary: "The skill tree and lesson routes with server-side unlocks, and progress: xp, hearts and their regeneration, streaks, crowns and the next-skill unlock."
  - id: B08
    name: pronunciation
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/services/scoring.ts", "backend/src/routes/pronunciation.ts", "backend/test/scoring.test.ts", "backend/test/pronunciation.test.ts"]
    summary: "Deterministic transcript-vs-target scoring and the multipart pronunciation route: transcribe, score, save the attempt."
  - id: B09
    name: tutor-session
    deps: [B03, B04, B05]
    track: done
    status: imported
    owns: ["backend/src/routes/tutor.ts", "backend/test/tutor.test.ts"]
    summary: "POST /api/tutor/session: a LiveKit room token with the CEFR level and scenario as room metadata, and the saved session row."
  - id: B10
    name: api-server
    deps: [B02, B03, B04, B05, B06, B07, B08, B09]
    track: done
    status: imported
    owns: ["backend/src/app.ts", "backend/src/index.ts", "backend/test/integration.test.ts"]
    summary: "buildApp (CORS, helmet, multipart limit, error handler, /health, the routes) and the server boot: guard, schema, auto-seed, listen; with the end-to-end test over the committed curriculum."
  - id: B11
    name: backend-image
    deps: [B01, B06, B10, R03]
    track: done
    status: imported
    owns: ["backend/Dockerfile"]
    summary: "The two-stage production image built from the repository root, with the curriculum baked in under CONTENT_DIR, run as the node user."
