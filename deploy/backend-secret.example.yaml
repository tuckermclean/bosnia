# Template for the backend's runtime secrets — every env var backend/src/env.ts
# reads that isn't a plain default. Copy this file, fill in real values, and
# apply the COPY (never this example, and never commit the filled-in copy):
#
#   cp deploy/backend-secret.example.yaml deploy/backend-secret.yaml
#   $EDITOR deploy/backend-secret.yaml   # fill in real values
#   kubectl apply -f deploy/backend-secret.yaml
#
# `deploy/backend-secret.yaml` is gitignored (see root .gitignore) so this is
# hard to get wrong, but double-check `git status` before committing anyway.
#
# voice-agent reads the same Secret (see deploy/voice-agent-deployment.yaml)
# for its LiveKit/Groq/Azure credentials — one Secret, two Deployments.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ljiljan
type: Opaque
stringData:
  # Your HA Postgres connection string. Non-empty here is what switches the
  # backend from PGlite (local dev/test only) to real Postgres — see
  # `isLocalDb` in backend/src/env.ts. Include `sslmode=require` (or your
  # cluster's equivalent) if your Postgres requires TLS.
  DATABASE_URL: "postgresql://USER:PASSWORD@YOUR-HA-POSTGRES-HOST:5432/ljiljan?sslmode=require"

  # Long, random, distinct secrets — required. The backend has a boot guard
  # (assertProductionSecretsAreSafe() in backend/src/env.ts) that REFUSES to
  # start when DATABASE_URL is set (non-local mode) and either secret is
  # missing or still a "dev-"-prefixed placeholder. Generate real ones with:
  #   openssl rand -base64 48
  JWT_ACCESS_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_ANOTHER_LONG_RANDOM_SECRET"

  # Groq: pronunciation-grading STT (backend) and, by default, the
  # voice-agent's STT + LLM too. https://console.groq.com/keys
  GROQ_API_KEY: "REPLACE_ME"

  # LiveKit project (real-time voice-tutor transport) — LiveKit Cloud or
  # self-hosted `livekit-server`. Used by both backend (mints room tokens)
  # and voice-agent (joins rooms as the worker).
  LIVEKIT_URL: "wss://your-project.livekit.cloud"
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME"

  # Azure Neural TTS — the voice-agent's bs-BA voice (Vesna/Goran).
  AZURE_SPEECH_KEY: "REPLACE_ME"
  AZURE_SPEECH_REGION: "westeurope"
