# The API server: Fastify + Drizzle, built from backend/Dockerfile, published
# by .github/workflows/release.yml to ghcr.io/OWNER/ljiljan-backend.
#
# Replace OWNER below with your (lowercased) GitHub username/org before
# applying. See DEPLOY.md for the imagePullSecret this references
# (`ghcr-pull-secret`) if the GHCR package isn't public.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ljiljan
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/OWNER/ljiljan-backend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          # DATABASE_URL, JWT_*, GROQ_API_KEY, LIVEKIT_*, AZURE_* all come
          # from the Secret (see deploy/backend-secret.example.yaml).
          envFrom:
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
