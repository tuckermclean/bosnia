# ClusterIP Service fronting the backend Deployment. Expose it externally via
# an Ingress (see deploy/ingress.yaml) or a cloud LoadBalancer, per your setup.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ljiljan
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
