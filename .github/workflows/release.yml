name: Release

# Builds & pushes the two runtime-service container images to GHCR:
#   ghcr.io/<owner>/ljiljan-backend
#   ghcr.io/<owner>/ljiljan-voice-agent
#
# Runs on every push to main (rolling `latest` + a `sha-...` tag for exact
# traceability) and on `v*` tags (adds semver tags for a pinned release).
# The `app` package is not built here — it's an Expo client shipped via EAS,
# not a container.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Reuse ci.yml's full test suite as a gate: images are only built and
  # pushed if backend, content, app, and voice-agent all pass.
  test:
    uses: ./.github/workflows/ci.yml

  build-backend:
    name: Build & push backend image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path; github.repository_owner isn't
      # guaranteed to be (org/user names can contain uppercase).
      - name: Lowercase repository owner
        id: owner
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/ljiljan-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          # Build context is the REPO ROOT, not backend/ — the backend image
          # needs the root workspace manifests and content/generated (see
          # backend/Dockerfile's top comment).
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-voice-agent:
    name: Build & push voice-agent image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/ljiljan-voice-agent
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          # voice-agent is self-contained: context is voice-agent/ itself.
          context: voice-agent
          file: voice-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=voice-agent
          cache-to: type=gha,mode=max,scope=voice-agent
